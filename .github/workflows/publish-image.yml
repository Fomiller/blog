name: Publish image

on:
  pull_request:
    paths: [src/**, Dockerfile]
  push:
    branches: [main]
    paths: [src/**, Dockerfile]

jobs:
  image:
    uses: Fomiller/gh-actions/.github/workflows/docker-ecr.yaml@main
    permissions:
      id-token: write
      contents: read
    with:
      repository: blog
      role-to-assume: arn:aws:iam::695434033664:role/github-actions-ecr
      aws-region: us-east-1
      platforms: linux/amd64
      # A pull request builds the image and throws it away. Only main pushes.
      push: ${{ github.event_name == 'push' }}
    secrets: inherit
