# Written once, then it is yours. `nix run .#generate` never touches it again.
#
# NOT what Argo CD renders any more. The Application pulls the chart from ECR
# directly and reads only the values.app*.yaml files beside this one, because
# Argo CD cannot authenticate kustomize's helm against a private OCI registry.
# See k8s/services/README.md in homelab. Kept because the pack still writes it;
# retiring it is FOM-176.
#
# `version` below is the deployed chart version. A promotion tool rewrites
# it on each release, which is why this file is written once rather than
# regenerated — a regenerate would put repo.nix's value back.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: blog-chart
    repo: oci://695434033664.dkr.ecr.us-east-1.amazonaws.com
    version: 0.1.0
    releaseName: blog-prod
    namespace: blog
    # Shared defaults first, this environment's overrides second. On a key both
    # files set, the later one wins.
    valuesFile: ../values.app.base.yaml
    additionalValuesFiles:
      - values.app.yaml
