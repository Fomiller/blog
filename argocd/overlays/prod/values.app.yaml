# Written once, then it is yours. `nix run .#generate` never touches it again.
#
# prod overrides, layered on ../values.app.base.yaml. Only keys that differ from
# the base belong here.

# Written by Kargo on every promotion. tag@digest, not a bare tag: the digest
# makes a deploy reproducible, the tag keeps `kubectl describe` readable.
#
# This used to be a Helm parameter homelab passed in, which beat whatever this
# file said. Nothing overrides it now, so it has to carry the real value.
image:
  tag: e0ccac9@sha256:525c490f0ae1f6da7cc9e5cda6c934f1d0501f8fdefb9d490e4a6d6b53499781

# The Cloudflare tunnel forwards this hostname to Traefik because homelab lists
# it in public_hostnames. This is the half that tells Traefik which Service
# answers for it.
ingressRoute:
  host: blog.fomiller.com

# DIRECTUS_URL has a working default in astro.config.mjs, so it is not repeated
# here. Only the credential needs saying, and it is referenced rather than
# inlined.
envFrom:
  - secretRef:
      name: blog-application-secret

# The Secret above, minted from Secrets Manager into this namespace. The entry
# there is Terraform's — see homelab's
# infra/units/aws/global/secrets/blog.tf — and carries DIRECTUS_TOKEN.
externalSecrets:
  blog-application-secret:
    secretStore:
      name: aws-clustersecretstore
    remoteKey: dev/fomiller/homelab/blog-application-secret
