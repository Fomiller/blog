# blog.fomiller.com is already covered by the *.fomiller.com wildcard DNS
# record, and the Cloudflare tunnel forwards the hostname to Traefik because
# it is listed in public_hostnames (homelab, infra/units/cloudflare). Traefik
# then needs to know which Service answers for it, which is this file.
#
# It lives in the prod overlay rather than the chart because the hostname is
# this environment's, not the chart's. A second environment would route its
# own name from its own overlay.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: blog
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`blog.fomiller.com`)
      kind: Rule
      services:
        - name: blog
          port: 8080
