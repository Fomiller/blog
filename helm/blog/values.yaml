# Written once, then it is yours. `nix run .#generate` never touches it again.

replicas: 1

image:
  repository: blog
  tag: latest

# Empty here on purpose. This file is the chart's own default, used by
# `helm template` and by anyone rendering the chart directly, where the image
# reference is a bare repository name and needs no credential. The overlays
# pull from ECR and name the Secret themselves — see
# argocd/overlays/values.app.base.yaml.
imagePullSecrets: []

# No host means no IngressRoute. Routing is an environment's decision, so the
# overlay that owns the hostname sets it — see
# argocd/overlays/<env>/values.app.yaml.
ingressRoute:
  host: ""
  entryPoint: web

# Plain configuration, in the normal container env shape.
env: []

# Secrets. A Secret is referenced, never inlined, so nothing sensitive appears
# in a rendered chart or an Argo CD diff.
envFrom: []

# Secrets this chart creates from the cluster's secret store. The map key names
# the Secret, so a key here is what envFrom above refers to.
#
# Empty by default: rendering the chart should not need a ClusterSecretStore to
# exist. The overlay that deploys turns them on.
#
#   externalSecrets:
#     blog-application-secret:
#       secretStore:
#         name: aws-clustersecretstore
#       remoteKey: dev/fomiller/homelab/blog-application-secret
externalSecrets: {}
